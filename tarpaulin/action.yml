name: "cargo-tarpaulin coverage"
description: "Install cargo-tarpaulin from a prebuilt release and run coverage. Linux only."
inputs:
  version:
    description: "cargo-tarpaulin version (without leading v). Pinned for supply-chain safety."
    default: "0.37.0"
  args:
    description: "Extra args to 'cargo tarpaulin' (e.g. '--workspace --exclude-files tests/*')."
    default: "--workspace"
  out:
    description: "Space-separated output formats: Stdout, Xml, Html, Lcov, Json."
    default: "Stdout"
  timeout:
    description: "Per-test timeout in seconds (tarpaulin --timeout)."
    default: "300"
  fail-under:
    description: "Fail if total line coverage is below this percent. Empty = don't enforce."
    default: ""
outputs:
  percent:
    description: "Total line coverage percentage (e.g. 60.4)."
    value: ${{ steps.run.outputs.percent }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../_lib/common.sh"
        if [ "$(uname -s)" != "Linux" ]; then
          echo "tarpaulin: Linux only"; exit 1
        fi
        wa_check_version "$INPUT_VERSION"

        if ! command -v cargo-tarpaulin >/dev/null; then
          arch=$(wa_arch)
          dest="$HOME/.cargo/bin"; mkdir -p "$dest"
          curl -fsSL "https://github.com/xd009642/tarpaulin/releases/download/$INPUT_VERSION/cargo-tarpaulin-$arch-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$dest" cargo-tarpaulin
          echo "$dest" >> "$GITHUB_PATH"
          export PATH="$dest:$PATH"
        fi
        cargo tarpaulin --version

        outs=""
        for o in $INPUT_OUT; do outs="$outs --out $o"; done
        fu=""
        if [ -n "$INPUT_FAIL_UNDER" ]; then fu="--fail-under $INPUT_FAIL_UNDER"; fi

        # Tee so we can scrape the headline "XX.XX% coverage" into an output.
        cargo tarpaulin --timeout "$INPUT_TIMEOUT" $outs $fu $INPUT_ARGS 2>&1 | tee /tmp/tarpaulin.out
        pct=$(grep -oE '[0-9]+\.[0-9]+% coverage' /tmp/tarpaulin.out | tail -1 | grep -oE '^[0-9]+\.[0-9]+' || true)
        echo "percent=${pct:-0}" >> "$GITHUB_OUTPUT"
        echo "coverage: ${pct:-unknown}%"
