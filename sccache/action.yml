name: "sccache"
description: "Install sccache and point it at the GitHub Actions cache. Exports RUSTC_WRAPPER for later steps."
inputs:
  version:
    description: "sccache release tag."
    default: "v0.16.0"
  key-prefix:
    description: "Namespaces the cache entries (SCCACHE_GHA_VERSION). Bump it to invalidate everything sccache has stored."
    default: ""
runs:
  using: composite
  steps:
    # sccache reads ACTIONS_RESULTS_URL / ACTIONS_RUNTIME_TOKEN, which the runner
    # exposes to JS actions but not to `run:` steps. A github-script step can see
    # them, so it re-exports them for the build steps that follow.
    #
    # ACTIONS_CACHE_URL is deliberately NOT re-exported: it points at the retired
    # v1 cache service, and sccache prefers it whenever it is set, which makes
    # every compile fail on a service that answers with an outage page.
    - uses: actions/github-script@v9
      with:
        script: |
          for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
            const value = process.env[name]
            if (!value) continue
            if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value)
            core.exportVariable(name, value)
          }

    - shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_KEY_PREFIX: ${{ inputs.key-prefix }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../_lib/common.sh"

        if ! command -v sccache >/dev/null; then
          arch=$(wa_arch)
          case "$(uname -s)" in
            Linux)  slug="$arch-unknown-linux-musl" ;;
            Darwin) slug="$arch-apple-darwin" ;;
            *) echo "unsupported os: $(uname -s)"; exit 1 ;;
          esac
          wa_check_version "$INPUT_VERSION"
          dest="$HOME/.cargo/bin"; mkdir -p "$dest"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/$INPUT_VERSION/sccache-$INPUT_VERSION-$slug.tar.gz" \
            | tar -xz --strip-components=1 -C "$dest" "sccache-$INPUT_VERSION-$slug/sccache"
          echo "$dest" >> "$GITHUB_PATH"
        fi
        sccache --version

        # Persist the backend for later steps.
        echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        # sccache can't cache incremental artifacts, so keep cargo from making them.
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        if [ -n "$INPUT_KEY_PREFIX" ]; then
          # Written via a random-delimiter heredoc so a stray newline can't
          # inject extra GITHUB_ENV entries.
          d="__ghenv_$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')"
          { printf 'SCCACHE_GHA_VERSION<<%s\n' "$d"; printf '%s\n' "$INPUT_KEY_PREFIX"; printf '%s\n' "$d"; } >> "$GITHUB_ENV"
        fi
