name: "sccache"
description: "Install sccache and point it at an S3-compatible bucket (e.g. Cloudflare R2). Exports RUSTC_WRAPPER for later steps."
inputs:
  version:
    description: "sccache release tag."
    default: "v0.16.0"
  bucket:
    description: "Bucket name (SCCACHE_BUCKET)."
    required: true
  endpoint:
    description: "S3 endpoint URL, e.g. https://<account>.r2.cloudflarestorage.com. Omit for AWS S3."
    default: ""
  region:
    description: "Region (SCCACHE_REGION). R2 wants 'auto'."
    default: "auto"
  key-prefix:
    description: "Optional key prefix within the bucket (SCCACHE_S3_KEY_PREFIX)."
    default: ""
  access-key-id:
    description: "Access key id (AWS_ACCESS_KEY_ID)."
    required: true
  secret-access-key:
    description: "Secret access key (AWS_SECRET_ACCESS_KEY)."
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_BUCKET: ${{ inputs.bucket }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_KEY_PREFIX: ${{ inputs.key-prefix }}
        INPUT_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        INPUT_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
      run: |
        set -euo pipefail

        if ! command -v sccache >/dev/null; then
          case "$(uname -m)" in
            aarch64|arm64) arch=aarch64 ;;
            x86_64|amd64)  arch=x86_64 ;;
            *) echo "unsupported arch: $(uname -m)"; exit 1 ;;
          esac
          case "$(uname -s)" in
            Linux)  slug="$arch-unknown-linux-musl" ;;
            Darwin) slug="$arch-apple-darwin" ;;
            *) echo "unsupported os: $(uname -s)"; exit 1 ;;
          esac
          case "$INPUT_VERSION" in
            *[!A-Za-z0-9._-]*) echo "invalid version: $INPUT_VERSION"; exit 1 ;;
          esac
          dest="$HOME/.cargo/bin"; mkdir -p "$dest"
          curl -fsSL "https://github.com/mozilla/sccache/releases/download/$INPUT_VERSION/sccache-$INPUT_VERSION-$slug.tar.gz" \
            | tar -xz --strip-components=1 -C "$dest" "sccache-$INPUT_VERSION-$slug/sccache"
          echo "$dest" >> "$GITHUB_PATH"
        fi
        sccache --version

        # Persist the backend for later steps. Values are written via a random-delimiter
        # heredoc so a stray newline can't inject extra GITHUB_ENV entries.
        emit() {  # emit NAME VALUE
          local d="__ghenv_$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')"
          { printf '%s<<%s\n' "$1" "$d"; printf '%s\n' "$2"; printf '%s\n' "$d"; } >> "$GITHUB_ENV"
        }
        echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
        # sccache can't cache incremental artifacts, so keep cargo from making them.
        echo "CARGO_INCREMENTAL=0" >> "$GITHUB_ENV"
        emit SCCACHE_BUCKET "$INPUT_BUCKET"
        emit SCCACHE_REGION "$INPUT_REGION"
        emit AWS_ACCESS_KEY_ID "$INPUT_ACCESS_KEY_ID"
        emit AWS_SECRET_ACCESS_KEY "$INPUT_SECRET_ACCESS_KEY"
        if [ -n "$INPUT_ENDPOINT" ]; then emit SCCACHE_ENDPOINT "$INPUT_ENDPOINT"; fi
        if [ -n "$INPUT_KEY_PREFIX" ]; then emit SCCACHE_S3_KEY_PREFIX "$INPUT_KEY_PREFIX"; fi
