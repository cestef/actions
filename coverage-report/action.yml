name: "coverage report"
description: "Turn a coverage report into a badge, a job summary, a pull-request comment and an optional ratchet gate. State lives on an orphan branch of the repo itself, so it needs no bucket and no credentials beyond the workflow token. Format-agnostic (cobertura, lcov) and every surface is optional."
inputs:
  # --- input report ---
  file:
    description: "Coverage report to read."
    default: "cobertura.xml"
  format:
    description: "auto (by extension), cobertura, or lcov."
    default: "auto"

  # --- where state lives ---
  branch:
    description: "Orphan branch holding the badge and the baseline."
    default: "badges"
  path-prefix:
    description: "Subdirectory within the branch, so one branch can hold several projects."
    default: ""
  badge-file:
    default: "coverage.svg"
  state-file:
    description: "Baseline JSON: total, per-file counts, and the commit it came from."
    default: "coverage.json"
  publish:
    description: "Push the badge and baseline. Only ever happens on a default-branch push."
    default: "true"

  # --- badge ---
  badge-style:
    description: "gauge (value half doubles as a fill bar) or flat."
    default: "gauge"
  badge-label:
    default: "coverage"
  badge-label-color:
    default: "#24292f"
  badge-thresholds:
    description: "Comma list of min-percent:color, highest first. First entry whose min <= coverage wins."
    default: "90:#3fb950,75:#7bc62d,60:#d5b60a,40:#e0902f,0:#e5534b"
  badge-link:
    description: "Embed the badge image in the summary and comment."
    default: "true"

  # --- surfaces ---
  summary:
    description: "Write the report to the job summary."
    default: "true"
  comment:
    description: "Upsert a pull-request comment."
    default: "true"
  marker:
    description: "Hidden HTML marker identifying this action's comment, so it updates instead of piling up."
    default: "<!-- coverage-report -->"
  top:
    description: "Per-file rows shown before the rest collapse into a <details>."
    default: "10"

  # --- gate ---
  ratchet:
    description: "Fail a pull request that drops below (baseline - tolerance)."
    default: "false"
  tolerance:
    description: "Allowed coverage drop, in percentage points."
    default: "0.5"

  # --- forge ---
  token:
    description: "Token for reading the baseline, commenting, and pushing. Without it the action still renders locally."
    default: ""
  repo:
    description: "owner/repo."
    default: ${{ github.repository }}
  server-url:
    description: "REST API base."
    default: ${{ github.api_url }}
  raw-url:
    description: "Raw content host, used to build the badge URL."
    default: "https://raw.githubusercontent.com"
  git-url:
    description: "Git host used to push the badge branch."
    default: ${{ github.server_url }}
  event-name:
    default: ${{ github.event_name }}
  ref-name:
    default: ${{ github.ref_name }}
  pr-number:
    default: ${{ github.event.pull_request.number }}
  commit:
    description: "Commit the coverage belongs to, recorded in the baseline."
    default: ${{ github.sha }}
  default-branch:
    default: "main"
  commit-message:
    default: "chore: coverage badge"
  commit-user:
    default: "github-actions[bot]"
  commit-email:
    default: "41898282+github-actions[bot]@users.noreply.github.com"

outputs:
  percent:
    description: "Total line coverage, two decimals."
    value: ${{ steps.report.outputs.percent }}
  delta:
    description: "Signed change vs the baseline, or n/a."
    value: ${{ steps.report.outputs.delta }}
  covered:
    value: ${{ steps.report.outputs.covered }}
  total:
    value: ${{ steps.report.outputs.total }}

runs:
  using: composite
  steps:
    - id: report
      shell: bash
      env:
        INPUT_FILE: ${{ inputs.file }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_PATH_PREFIX: ${{ inputs.path-prefix }}
        INPUT_BADGE_FILE: ${{ inputs.badge-file }}
        INPUT_STATE_FILE: ${{ inputs.state-file }}
        INPUT_BADGE_STYLE: ${{ inputs.badge-style }}
        INPUT_BADGE_LABEL: ${{ inputs.badge-label }}
        INPUT_BADGE_LABEL_COLOR: ${{ inputs.badge-label-color }}
        INPUT_BADGE_THRESHOLDS: ${{ inputs.badge-thresholds }}
        INPUT_BADGE_LINK: ${{ inputs.badge-link }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_MARKER: ${{ inputs.marker }}
        INPUT_TOP: ${{ inputs.top }}
        INPUT_RATCHET: ${{ inputs.ratchet }}
        INPUT_TOLERANCE: ${{ inputs.tolerance }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_SERVER_URL: ${{ inputs.server-url }}
        INPUT_RAW_URL: ${{ inputs.raw-url }}
        INPUT_EVENT_NAME: ${{ inputs.event-name }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_COMMIT: ${{ inputs.commit }}
        INPUT_STAGE: ${{ runner.temp }}/coverage-report
      run: python3 "$GITHUB_ACTION_PATH/report.py"

    # Publishing is a default-branch push only: a pull request reports and gates
    # but never moves the baseline it is measured against.
    - if: >-
        inputs.publish == 'true' && inputs.token != ''
        && inputs.event-name == 'push' && inputs.ref-name == inputs.default-branch
      shell: bash
      env:
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_REPO: ${{ inputs.repo }}
        INPUT_GIT_URL: ${{ inputs.git-url }}
        INPUT_MESSAGE: ${{ inputs.commit-message }}
        INPUT_USER: ${{ inputs.commit-user }}
        INPUT_EMAIL: ${{ inputs.commit-email }}
        STAGE: ${{ steps.report.outputs.stage }}
      run: |
        set -euo pipefail
        # The token goes in a header rather than the remote URL, so it cannot be
        # echoed back by git's own error messages.
        auth="AUTHORIZATION: Basic $(printf 'x-access-token:%s' "$INPUT_TOKEN" | base64 -w0)"
        remote="${INPUT_GIT_URL%/}/$INPUT_REPO.git"

        work=$(mktemp -d)
        git init -q -b "$INPUT_BRANCH" "$work"
        git -C "$work" remote add origin "$remote"
        # An existing branch is extended; a missing one starts as a fresh orphan,
        # so the badge branch never carries the repository's own history.
        if git -C "$work" -c http.extraheader="$auth" fetch -q --depth 1 origin "$INPUT_BRANCH"; then
          git -C "$work" reset -q --hard FETCH_HEAD
        fi

        cp -R "$STAGE"/. "$work"/
        git -C "$work" add -A
        if git -C "$work" diff --cached --quiet; then
          echo "coverage-report: badge and baseline unchanged"
          exit 0
        fi
        git -C "$work" \
          -c user.name="$INPUT_USER" -c user.email="$INPUT_EMAIL" \
          commit -q -m "$INPUT_MESSAGE"
        git -C "$work" -c http.extraheader="$auth" push -q origin "HEAD:$INPUT_BRANCH"
        echo "coverage-report: published to $INPUT_BRANCH"
