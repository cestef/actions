name: "wrangler"
description: "Run Cloudflare Wrangler (deploy by default), caching the pinned install (wrangler + native workerd) in the GitHub Actions cache so ephemeral runners skip the npm download. Node required on the runner."
inputs:
  version:
    description: "Wrangler version (npm semver, no leading v). Pinned for supply-chain safety and as the cache key."
    default: "4.112.0"
  command:
    description: "Wrangler command + args (e.g. 'deploy --minify', 'versions upload')."
    default: "deploy"
  working-directory:
    description: "Directory to run wrangler in (where wrangler.toml/jsonc lives)."
    default: "."
  api-token:
    description: "Cloudflare API token. Exported as CLOUDFLARE_API_TOKEN."
    default: ""
  account-id:
    description: "Cloudflare account ID. Exported as CLOUDFLARE_ACCOUNT_ID."
    default: ""
  cache:
    description: "Cache the install. false runs plain npx instead."
    default: "true"
  prefix:
    description: "Cache key prefix."
    default: "wrangler"
runs:
  using: composite
  steps:
    # workerd is a native, arch-specific dependency, so the os and arch are part
    # of the key. Computed before the cache step, which cannot run shell itself.
    - id: plan
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../_lib/common.sh"
        wa_check_version "$INPUT_VERSION"
        arch=$(wa_arch); os=$(uname -s)
        dir="$HOME/.cache/wrangler/$INPUT_VERSION-$os-$arch"
        {
          printf 'dir=%s\n' "$dir"
          printf 'key=%s-%s-%s-%s\n' "$INPUT_PREFIX" "$INPUT_VERSION" "$os" "$arch"
        } >> "$GITHUB_OUTPUT"

    # Restores before the install below and saves in the job's post phase, so a
    # miss populates the cache without a second call.
    - if: inputs.cache == 'true'
      uses: actions/cache@v4
      with:
        path: ${{ steps.plan.outputs.dir }}
        key: ${{ steps.plan.outputs.key }}

    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_CACHE: ${{ inputs.cache }}
        INPUT_DIR: ${{ steps.plan.outputs.dir }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account-id }}
      run: |
        set -euo pipefail
        command -v node >/dev/null || { echo "wrangler: node not found"; exit 1; }
        command -v npm  >/dev/null || { echo "wrangler: npm not found"; exit 1; }

        if [ "$INPUT_CACHE" != true ]; then
          npx --yes "wrangler@$INPUT_VERSION" $INPUT_COMMAND
          exit 0
        fi

        bin="$INPUT_DIR/node_modules/.bin/wrangler"
        if [ ! -x "$bin" ]; then
          echo "wrangler: cache miss, installing wrangler@$INPUT_VERSION"
          rm -rf "$INPUT_DIR"; mkdir -p "$INPUT_DIR"
          npm install --no-save --no-audit --no-fund --prefix "$INPUT_DIR" "wrangler@$INPUT_VERSION"
        fi

        "$bin" $INPUT_COMMAND
