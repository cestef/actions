name: "memory diagnostics"
description: "Detailed memory forensics for CI runners: cgroup (v2/v1) usage vs cap, OOM events, memory.stat breakdown, system meminfo, and top-RSS processes. Best run with if: failure() on memory-capped runners."
inputs:
  processes:
    description: "List the top memory-consuming processes."
    default: "true"
  top:
    description: "How many top processes / stat lines to show."
    default: "10"
  dmesg:
    description: "Attempt to scan the kernel ring buffer for OOM kills (often unavailable in containers)."
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_PROCESSES: ${{ inputs.processes }}
        INPUT_TOP: ${{ inputs.top }}
        INPUT_DMESG: ${{ inputs.dmesg }}
      run: |
        # Diagnostics must never fail the job.
        set +e
        top=$INPUT_TOP
        case "$top" in ''|*[!0-9]*) top=10 ;; esac
        echo "::group::memory diagnostics"

        human() { numfmt --to=iec-i --suffix=B "$1" 2>/dev/null || echo "${1} B"; }

        if [ -f /sys/fs/cgroup/memory.current ]; then
          cg=/sys/fs/cgroup; v=2
        elif [ -f /sys/fs/cgroup/memory/memory.usage_in_bytes ]; then
          cg=/sys/fs/cgroup/memory; v=1
        else
          v=0
        fi
        echo "cgroup version: v$v"

        if [ "$v" = 2 ]; then
          cur=$(cat "$cg/memory.current" 2>/dev/null)
          peak=$(cat "$cg/memory.peak" 2>/dev/null)
          max=$(cat "$cg/memory.max" 2>/dev/null)
          swap=$(cat "$cg/memory.swap.current" 2>/dev/null)
          echo "  current : $(human "${cur:-0}")"
          [ -n "$peak" ] && echo "  peak    : $(human "$peak")"
          echo "  limit   : $max"
          [ -n "$swap" ] && echo "  swap    : $(human "$swap")"
          if [ "$max" != max ] && [ -n "$peak" ]; then
            awk -v p="$peak" -v m="$max" 'BEGIN{ if (m>0) printf "  peak/limit: %.1f%%\n", 100*p/m }'
          fi
          echo "  events  :"
          sed 's/^/    /' "$cg/memory.events" 2>/dev/null
          echo "  breakdown (memory.stat, top $top):"
          sort -k2 -nr "$cg/memory.stat" 2>/dev/null | head -n "$top" | \
            while read -r k b; do printf "    %-24s %s\n" "$k" "$(human "$b")"; done
        elif [ "$v" = 1 ]; then
          echo "  usage   : $(human "$(cat "$cg/memory.usage_in_bytes" 2>/dev/null)")"
          echo "  maxusage: $(human "$(cat "$cg/memory.max_usage_in_bytes" 2>/dev/null)")"
          echo "  limit   : $(human "$(cat "$cg/memory.limit_in_bytes" 2>/dev/null)")"
          echo "  failcnt : $(cat "$cg/memory.failcnt" 2>/dev/null)"
        else
          echo "  (no cgroup memory controller found)"
        fi

        echo "system:"
        grep -E 'MemTotal|MemAvailable|MemFree|SwapTotal|SwapFree' /proc/meminfo 2>/dev/null | sed 's/^/  /'

        if [ "$INPUT_PROCESSES" = true ]; then
          echo "top $top processes by RSS:"
          ps -eo rss=,pid=,comm= --sort=-rss 2>/dev/null | head -n "$top" | \
            while read -r rss pid comm; do printf "  %-10s %-8s %s\n" "$(human "$((rss*1024))")" "$pid" "$comm"; done
        fi

        if [ "$INPUT_DMESG" = true ]; then
          echo "kernel OOM (best-effort):"
          out=$(dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -n "$top")
          [ -n "$out" ] && echo "$out" | sed 's/^/  /' || echo "  (unavailable or none)"
        fi

        echo "::endgroup::"
        exit 0
