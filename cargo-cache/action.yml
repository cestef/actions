name: "cargo cache"
description: "Persist cargo state to the GitHub Actions cache. By default caches ~/.cargo registry + git downloads, keyed on Cargo.lock; point base/paths at the workspace target/ to also cache dependency rlibs, build-script outputs, and cargo's fingerprint DB (which sccache does not). Call once with mode: restore before the build, once with mode: save after."
inputs:
  mode:
    description: "restore (default) or save."
    default: "restore"
  prefix:
    description: "Key prefix. Also namespaces the cache, so use distinct prefixes for the registry and the target/ caches."
    default: "cargo-cache"
  key:
    description: "Cache key override. Default: a hash of Cargo.lock (plus the rustc version when toolchain-key is true)."
    default: ""
  toolchain-key:
    description: "Mix the rustc version into the default key. Set true for target/ (artifacts are toolchain-specific); leave false for the registry."
    default: "false"
  base:
    description: "Directory the paths are relative to. Empty means $HOME."
    default: ""
  paths:
    description: "Space-separated dirs to cache, relative to base."
    default: ".cargo/registry/index .cargo/registry/cache .cargo/git/db"
outputs:
  hit:
    description: "true when restore found an exact key match."
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    # The key and the absolute path list are derived once, in shell, so restore
    # and save cannot disagree about either.
    - id: plan
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_KEY: ${{ inputs.key }}
        INPUT_TOOLCHAIN_KEY: ${{ inputs.toolchain-key }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        base="${INPUT_BASE:-$HOME}"

        key="$INPUT_KEY"
        if [ -z "$key" ]; then
          material=""
          # Compiled artifacts are toolchain-specific, so the rustc version joins the key.
          if [ "$INPUT_TOOLCHAIN_KEY" = true ]; then
            material="$(rustc -vV 2>/dev/null || echo no-rustc)"
          fi
          [ -f Cargo.lock ] && material="$material$(cat Cargo.lock)"
          if [ -n "$material" ]; then
            key=$(printf '%s' "$material" | sha256sum | cut -c1-16)
          else
            key=nolock
          fi
        fi
        # One cache is shared by every runner on the repo, so the OS and arch
        # belong in the key: an aarch64 target/ is not restorable on amd64.
        full="$INPUT_PREFIX-$(uname -s)-$(uname -m)-$key"

        # Random delimiter, so a path containing the terminator cannot inject
        # extra GITHUB_OUTPUT entries.
        d="__ghout_$(od -An -N6 -tx1 /dev/urandom | tr -d ' \n')"
        {
          printf 'key=%s\n' "$full"
          printf 'paths<<%s\n' "$d"
          for p in $INPUT_PATHS; do printf '%s/%s\n' "$base" "$p"; done
          printf '%s\n' "$d"
        } >> "$GITHUB_OUTPUT"
        echo "cargo-cache: $INPUT_MODE key=$full"

    - id: restore
      if: inputs.mode != 'save'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.plan.outputs.key }}

    # Keys are immutable: `actions/cache/save` warns and moves on when the key
    # already exists, which is the intended "already cached, skip" path.
    - if: inputs.mode == 'save'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.plan.outputs.paths }}
        key: ${{ steps.plan.outputs.key }}
