name: "cargo cache (S3/R2)"
description: "Persist cargo state to an S3-compatible bucket. By default caches ~/.cargo registry + git downloads, keyed on Cargo.lock; point base/paths at the workspace target/ to also cache dependency rlibs, build-script outputs, and cargo's fingerprint DB (which sccache does not). Complements sccache (compiler codegen) so ephemeral runners stop re-fetching and re-building. Call once with mode: restore before the build, once with mode: save after. Trust: anyone with bucket write access can influence what lands in the cached dirs, so treat the bucket as trusted (same model as the sccache bucket)."
inputs:
  mode:
    description: "restore (default) or save."
    default: "restore"
  bucket:
    description: "Bucket name."
    required: true
  endpoint:
    description: "S3 endpoint URL (e.g. https://<account>.r2.cloudflarestorage.com). Omit for AWS S3."
    default: ""
  access-key-id:
    required: true
  secret-access-key:
    required: true
  region:
    description: "S3 region. R2 wants 'auto'."
    default: "auto"
  prefix:
    description: "Key prefix within the bucket. Also namespaces the cache, so use distinct prefixes for the registry and the target/ caches."
    default: "cargo-cache"
  key:
    description: "Cache key override. Default: a hash of Cargo.lock (plus the rustc version when toolchain-key is true)."
    default: ""
  toolchain-key:
    description: "Mix the rustc version into the default key. Set true for target/ (artifacts are toolchain-specific); leave false for the registry."
    default: "false"
  base:
    description: "Directory the paths are relative to, and which the tar is rooted at. Empty means $HOME."
    default: ""
  paths:
    description: "Space-separated dirs to cache, relative to base."
    default: ".cargo/registry/index .cargo/registry/cache .cargo/git/db"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_BUCKET: ${{ inputs.bucket }}
        INPUT_ENDPOINT: ${{ inputs.endpoint }}
        INPUT_ACCESS_KEY_ID: ${{ inputs.access-key-id }}
        INPUT_SECRET_ACCESS_KEY: ${{ inputs.secret-access-key }}
        INPUT_REGION: ${{ inputs.region }}
        INPUT_PREFIX: ${{ inputs.prefix }}
        INPUT_KEY: ${{ inputs.key }}
        INPUT_TOOLCHAIN_KEY: ${{ inputs.toolchain-key }}
        INPUT_BASE: ${{ inputs.base }}
        INPUT_PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        source "$GITHUB_ACTION_PATH/../_lib/common.sh"
        wa_s3_init

        base="${INPUT_BASE:-$HOME}"

        key="$INPUT_KEY"
        if [ -z "$key" ]; then
          material=""
          # Compiled artifacts are toolchain-specific, so the rustc version joins the key.
          if [ "$INPUT_TOOLCHAIN_KEY" = true ]; then
            material="$(rustc -vV 2>/dev/null || echo no-rustc)"
          fi
          [ -f Cargo.lock ] && material="$material$(cat Cargo.lock)"
          if [ -n "$material" ]; then
            key=$(printf '%s' "$material" | sha256sum | cut -c1-16)
          else
            key=nolock
          fi
        fi
        obj="s3://$INPUT_BUCKET/$INPUT_PREFIX/$key.tar.gz"
        tmp="$(mktemp -d)/cargo-cache.tar.gz"

        if [ "$INPUT_MODE" = save ]; then
          # Immutable key: skip the upload if this cache already exists.
          if s5 ls "$obj" >/dev/null 2>&1; then
            echo "cargo-cache: $obj already present, skipping save"
            exit 0
          fi
          present=""
          for p in $INPUT_PATHS; do
            [ -e "$base/$p" ] && present="$present $p"
          done
          if [ -z "$present" ]; then
            echo "cargo-cache: nothing to save"
            exit 0
          fi
          tar -C "$base" -czf "$tmp" $present
          s5 cp "$tmp" "$obj"
          echo "cargo-cache: saved $obj ($(du -h "$tmp" | cut -f1))"
        else
          if s5 cp "$obj" "$tmp" >/dev/null 2>&1; then
            # Reject absolute paths and `..` traversal before extracting into base.
            if tar -tzf "$tmp" | grep -qE '^/|(^|/)\.\.(/|$)'; then
              echo "cargo-cache: refusing cache with unsafe tar members"
              exit 0
            fi
            tar -C "$base" --no-same-owner -xzf "$tmp"
            echo "cargo-cache: restored $obj"
          else
            echo "cargo-cache: miss ($obj)"
          fi
        fi
